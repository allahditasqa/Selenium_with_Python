name: Selenium Python Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests without third-party-site tests (headless Chrome, 4 workers, 1 retry)
        run: pytest -n 4 --reruns 1 -m "not external" --browser chrome --headless true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
