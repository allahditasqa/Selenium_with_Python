[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: fast sanity checks of every section
    regression: full functional coverage
    external: depends on third-party websites (can be slow or flaky)
    slow: takes more than a few seconds
log_file = logs/test.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
filterwarnings =
    ignore::DeprecationWarning
